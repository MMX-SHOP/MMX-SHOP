<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX | Private Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Orbitron:wght@500;900&display=swap');

        :root {
            --accent: #a855f7; /* Violet */
            --main: #ffffff;   /* Blanc */
            --bg: #000000;     /* Noir Pur */
        }

        * { cursor: crosshair !important; }

        body {
            background-color: var(--bg);
            color: var(--main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* --- BACKGROUND & STARS --- */
        #star-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        /* --- SPLASH SCREEN (THE END STYLE) --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        .enter-btn {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            border: 1px solid var(--accent);
            padding: 15px 40px;
            transition: 0.5s;
        }

        .enter-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 30px var(--accent);
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            height: 70px;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .nav-logo { height: 25px; filter: grayscale(1) brightness(2); }

        .nav-links a {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-left: 40px;
            color: rgba(255,255,255,0.5);
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--accent); }

        /* --- MAIN CONTENT --- */
        main {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 70px;
        }

        .product-container {
            width: 800px;
            display: flex;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .product-img-box {
            width: 40%;
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-box img {
            width: 100%;
            border-radius: 2px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .product-details {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .tag {
            font-size: 0.6rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            display: block;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .features {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            line-height: 1.8;
            margin-bottom: 30px;
            list-style: none;
            padding: 0;
        }

        .features li::before {
            content: "—";
            margin-right: 10px;
            color: var(--accent);
        }

        .buy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 25px;
        }

        .price { font-family: 'Orbitron'; font-size: 1.2rem; }

        .btn-purchase {
            background: var(--main);
            color: #000;
            padding: 10px 30px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-purchase:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent);
        }

        /* --- TOAST --- */
        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #111;
            border-left: 3px solid var(--accent);
            padding: 15px 25px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            transform: translateX(150%);
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        #toast.active { transform: translateX(0); }
    </style>
</head>
<body>

    <audio id="music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <!-- Splash Screen -->
    <div id="splash" onclick="init()">
        <div class="enter-btn">Initialize MMX</div>
    </div>

    <nav>
        <img src="logo.jpg" class="nav-logo" alt="MMX">
        <div class="nav-links">
            <a href="#">Products</a>
            <a href="https://discord.com/users/kyotouhq" target="_blank">Support</a>
            <a href="#">Status</a>
        </div>
    </nav>

    <canvas id="star-canvas"></canvas>

    <main>
        <div class="product-container">
            <div class="product-img-box">
                <!-- Ton image fortnite.png -->
                <img src="fortnite.png" onerror="this.src='https://via.placeholder.com/300x300/000/fff?text=FORTNITE+PRIVATE'" alt="Fortnite Private">
            </div>
            <div class="product-details">
                <span class="tag">Private Project — Undetected</span>
                <h2>Fortnite Internal</h2>
                <ul class="features">
                    <li>Kernel Mode Driver (Bypass EAC/BE)</li>
                    <li>Advanced Vector Aimbot</li>
                    <li>Player/Item ESP with VisCheck</li>
                    <li>Highly Customizable FOV & Smoothing</li>
                </ul>
                <div class="buy-row">
                    <div class="price">€25.00</div>
                    <button class="btn-purchase" onclick="notify()">Purchase Access</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast">API pas ajoutée pour le Moment</div>

    <script>
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shooters = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Stars setup
        for(let i=0; i<150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                s: Math.random() * 1,
                o: Math.random()
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            // Background Stars
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                ctx.globalAlpha = s.o;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
                ctx.fill();
            });

            // Shooting Stars (Etoiles filantes)
            shooters.forEach((sh, i) => {
                ctx.strokeStyle = "rgba(168, 85, 247, "+sh.o+")";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sh.x, sh.y);
                ctx.lineTo(sh.x + sh.l, sh.y - sh.l);
                ctx.stroke();
                sh.x -= sh.v;
                sh.y += sh.v;
                sh.o -= 0.01;
                if(sh.o <= 0) shooters.splice(i, 1);
            });

            if(Math.random() < 0.01) {
                shooters.push({
                    x: Math.random() * canvas.width,
                    y: 0,
                    l: Math.random() * 50 + 20,
                    v: Math.random() * 10 + 5,
                    o: 1
                });
            }

            requestAnimationFrame(draw);
        }
        draw();

        function init() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => document.getElementById('splash').style.visibility = 'hidden', 1200);
            document.getElementById('music').play();
        }

        function notify() {
            const t = document.getElementById('toast');
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 3000);
        }
    </script>
</body>
</html>
