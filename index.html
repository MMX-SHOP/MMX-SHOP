<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX | Private Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@700&display=swap');

        :root {
            --accent: rgb(167, 139, 250); /* Le violet exact de l'inspecteur */
            --bg: #000000;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- CANVAS PARTICLES (Code exact de image_82a17e.png) --- */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* --- NAVIGATION --- */
        #main-nav {
            position: fixed;
            top: 0; width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        #main-nav.scrolled {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            height: 60px;
            border-bottom: 1px solid rgba(167, 139, 250, 0.2);
        }

        .nav-logo { height: 24px; }

        /* --- GLOW DIVIDER --- */
        .glow-divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.2;
            margin: 40px 0;
        }

        /* --- SECTION STRUCTURE --- */
        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px;
            position: relative;
            z-index: 10;
        }

        /* --- PRODUCT CARD (Base de image_82a1e1.jpg) --- */
        .product-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            border-radius: 4px;
            overflow: hidden;
            max-width: 850px;
            margin: 0 auto;
        }

        .product-left {
            width: 45%;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-right {
            flex: 1;
            padding: 50px;
        }

        .tag-line {
            color: var(--accent);
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 12px;
        }

        .feature-item::before {
            content: "";
            width: 15px;
            height: 1px;
            background: var(--accent);
            margin-right: 15px;
        }

        .price-container {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
        }

        .btn-purchase {
            background: white;
            color: black;
            padding: 12px 30px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-purchase:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(167, 139, 240, 0.4);
        }

        /* --- FADE UP ANIMATION --- */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }

        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111;
            border: 1px solid var(--accent);
            padding: 15px 25px;
            font-size: 0.8rem;
            transform: translateY(200px);
            transition: 0.5s ease;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <canvas id="particles-canvas"></canvas>

    <nav id="main-nav">
        <img src="logo.jpg" class="nav-logo" alt="MMX">
        <div class="flex gap-8 text-[11px] font-bold uppercase tracking-widest">
            <a href="#platform" class="hover:text-purple-400">Products</a>
            <a href="https://discord.com/users/kyotouhq" target="_blank" class="hover:text-purple-400">Support</a>
            <a href="#" class="hover:text-purple-400">Status</a>
        </div>
    </nav>

    <section id="platform">
        <div class="section-inner">
            <!-- Product Card -->
            <div class="product-card fade-up">
                <div class="product-left">
                    <img src="fortnite.png" alt="Fortnite" class="w-full h-full object-cover">
                </div>
                <div class="product-right">
                    <p class="tag-line">Private Project — Undetected</p>
                    <h2 class="product-title">Fortnite Internal</h2>
                    
                    <div class="feature-item">Kernel Mode Driver (Bypass EAC/BE)</div>
                    <div class="feature-item">Advanced Vector Aimbot</div>
                    <div class="feature-item">Player/Item ESP with VisCheck</div>
                    <div class="feature-item">Highly Customizable FOV & Smoothing</div>

                    <div class="price-container">
                        <div class="price-text">€25.00</div>
                        <button class="btn-purchase" onclick="showToast()">Purchase Access</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="glow-divider"></div>

    <!-- Toast Notification -->
    <div id="toast">API pas ajoutée pour le Moment</div>

    <script>
        /* ---- PARTICLES (Recréé depuis image_82a17e.png) ---- */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, flakes = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function initFlakes() {
            flakes = [];
            for (let i = 0; i < 80; i++) {
                flakes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.8 + 0.4,
                    speed: Math.random() * 0.6 + 0.15,
                    drift: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.45 + 0.08
                });
            }
        }

        function drawFlakes() {
            ctx.clearRect(0, 0, W, H);
            for (const f of flakes) {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(167, 139, 250, ${f.opacity})`;
                ctx.fill();
                
                f.y += f.speed;
                f.x += f.drift;

                if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
                if (f.x > W + 4) f.x = -4;
                if (f.x < -4) f.x = W + 4;
            }
            requestAnimationFrame(drawFlakes);
        }

        window.addEventListener('resize', () => { resize(); initFlakes(); });
        resize(); initFlakes(); drawFlakes();

        /* ---- NAV SCROLL (Depuis image_82a17e.png) ---- */
        const nav = document.getElementById('main-nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('scrolled', window.scrollY > 24);
        });

        /* ---- FADE UP OBSERVER (Depuis image_82a17e.png) ---- */
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });

        document.querySelectorAll('.fade-up').forEach(el => io.observe(el));

        /* --- AUDIO & TOAST --- */
        window.onclick = () => { document.getElementById('bgMusic').play(); };

        function showToast() {
            const t = document.getElementById('toast');
            t.style.transform = "translateY(0)";
            setTimeout(() => { t.style.transform = "translateY(200px)"; }, 3000);
        }
    </script>
</body>
</html>
