<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX PRIVATE | Elite FN External</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@700&display=swap');

        :root { --accent: #a78bfa; --bg: #030207; }
        * { cursor: crosshair !important; box-sizing: border-box; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }

        /* --- FOND & ANIMATIONS --- */
        #nebula { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #0f081d 0%, #030207 100%); }
        
        .viewport {
            perspective: 2000px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px;
        }

        /* --- GLASS NAV --- */
        .glass-nav {
            position: fixed; top: 20px; width: 90%; max-width: 1200px;
            height: 60px; background: rgba(255,255,255,0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 1000;
        }

        /* --- PANEL 3D INCLINÉ --- */
        .mmx-panel {
            width: 1000px; height: 580px;
            background: rgba(10, 10, 15, 0.95);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            transform: rotateY(-12deg) rotateX(5deg);
            box-shadow: -40px 40px 80px rgba(0,0,0,0.8), 0 0 50px rgba(167, 139, 250, 0.05);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }
        .mmx-panel:hover { transform: rotateY(-3deg) rotateX(2deg) scale(1.01); }

        /* --- BARRE DE STATS (BAS DE PAGE) --- */
        .stats-bar {
            position: fixed; bottom: 30px; width: 90%; max-width: 1100px;
            background: rgba(167, 139, 250, 0.03); backdrop-filter: blur(25px);
            border: 1px solid rgba(167, 139, 250, 0.15); border-radius: 25px;
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            animation: slideUp 1s ease-out;
        }

        .stat-group { display: flex; align-items: center; gap: 40px; }
        .stat-item { text-align: center; }
        .stat-val { font-family: 'Orbitron'; font-size: 18px; font-weight: 700; color: white; display: block; }
        .stat-lbl { font-size: 8px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; }

        /* --- EFFET SHOOTING STAR --- */
        .star {
            position: absolute; background: linear-gradient(90deg, var(--accent), transparent);
            height: 1px; pointer-events: none; animation: fly 4s linear infinite;
        }
        @keyframes fly {
            0% { transform: translateX(-200px) translateY(0) rotate(45deg); opacity: 0; width: 0; }
            10% { opacity: 1; width: 100px; }
            100% { transform: translateX(1200px) translateY(1200px) rotate(45deg); opacity: 0; width: 0; }
        }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- CUSTOM SLIDER --- */
        input[type="range"] { appearance: none; background: rgba(255,255,255,0.05); height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); cursor: pointer; }
    </style>
</head>
<body>

    <div id="nebula"></div>
    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <!-- NAVIGATION -->
    <div class="flex justify-center">
        <nav class="glass-nav">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-[#a78bfa] rounded-full animate-pulse shadow-[0_0_10px_#a78bfa]"></div>
                <span class="text-[10px] font-black tracking-[4px] uppercase">MMX STATUS: UNDETECTED</span>
            </div>
            <div class="flex gap-8 text-[9px] font-bold uppercase tracking-widest opacity-40">
                <a href="#" class="hover:text-[#a78bfa] hover:opacity-100 transition">Features</a>
                <a href="#" class="hover:text-[#a78bfa] hover:opacity-100 transition">Pricing</a>
            </div>
            <button class="bg-[#a78bfa] text-black px-5 py-2 rounded-lg font-black text-[9px] uppercase tracking-tighter hover:scale-105 transition" onclick="window.open('https://discord.gg/kyotouhq')">Discord Access</button>
        </nav>
    </div>

    <div class="viewport">
        
        <!-- PANEL 3D PRINCIPAL -->
        <div class="mmx-panel">
            <!-- Sidebar -->
            <div class="w-64 bg-black/40 border-r border-white/5 p-8 flex flex-col">
                <div class="mb-10">
                    <h1 class="text-2xl font-black italic tracking-tighter">MMX<span class="text-[#a78bfa]">PRIVATE</span></h1>
                    <p class="text-[8px] font-bold opacity-20 uppercase tracking-[3px]">External Engine v2.4</p>
                </div>
                
                <div class="space-y-1">
                    <div class="p-4 bg-[#a78bfa]/10 border border-[#a78bfa]/20 rounded-xl flex items-center gap-4 text-[#a78bfa]">
                        <i data-lucide="crosshair" class="w-4 h-4"></i>
                        <span class="text-[10px] font-black uppercase">Combat</span>
                    </div>
                    <div class="p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 text-white/30 transition">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                        <span class="text-[10px] font-black uppercase">Visuals</span>
                    </div>
                    <div class="p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 text-white/30 transition">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        <span class="text-[10px] font-black uppercase">Exploits</span>
                    </div>
                    <div class="p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 text-white/30 transition">
                        <i data-lucide="shield" class="w-4 h-4"></i>
                        <span class="text-[10px] font-black uppercase">Bypass</span>
                    </div>
                </div>

                <div class="mt-auto p-4 bg-white/5 border border-white/5 rounded-2xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[8px] font-black opacity-40 uppercase">User:</span>
                        <span class="text-[8px] font-black text-[#a78bfa] uppercase">Elite Member</span>
                    </div>
                    <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                        <div class="w-3/4 h-full bg-[#a78bfa]"></div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="flex-1 p-12 bg-gradient-to-br from-transparent to-[#0a0616]">
                <div class="flex justify-between items-center mb-12">
                    <h3 class="text-3xl font-black italic tracking-tighter uppercase">Aimbot <span class="text-[#a78bfa]">Config</span></h3>
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/40"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/40"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/40"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-10">
                    <div class="space-y-6">
                        <div class="space-y-2">
                            <div class="flex justify-between text-[9px] font-black uppercase opacity-40"><span>Smoothing Factor</span><span>8.5</span></div>
                            <input type="range" class="w-full">
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-[9px] font-black uppercase opacity-40"><span>FOV Radius</span><span>150px</span></div>
                            <input type="range" class="w-full">
                        </div>
                        <div class="flex justify-between items-center p-4 bg-white/5 border border-white/5 rounded-xl">
                            <span class="text-[10px] font-black uppercase">Draw FOV Circle</span>
                            <div class="w-8 h-4 bg-[#a78bfa] rounded-full relative"><div class="absolute right-1 top-1 w-2 h-2 bg-white rounded-full"></div></div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="p-4 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center">
                            <span class="text-[10px] font-black uppercase">Target Bone</span>
                            <span class="text-[10px] text-[#a78bfa] font-bold">HEAD</span>
                        </div>
                        <div class="p-4 bg-white/5 border border-white/5 rounded-xl flex justify-between items-center">
                            <span class="text-[10px] font-black uppercase">Visible Check</span>
                            <div class="w-8 h-4 bg-white/10 rounded-full relative"><div class="absolute left-1 top-1 w-2 h-2 bg-white/20 rounded-full"></div></div>
                        </div>
                        <button class="w-full py-4 bg-[#a78bfa] text-black font-black uppercase text-[10px] rounded-xl shadow-[0_0_20px_rgba(167,139,250,0.2)] hover:scale-[1.02] transition">Apply Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER STATS (MMX DESIGN) -->
        <div class="stats-bar">
            <div class="stat-group">
                <div class="stat-item">
                    <span class="stat-val">24/7</span>
                    <span class="stat-lbl">Uptime</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">AES-256</span>
                    <span class="stat-lbl">Security</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">12ms</span>
                    <span class="stat-lbl">Latency</span>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="text-right">
                    <span class="block text-[10px] font-black text-green-400 uppercase">HWID Linked</span>
                    <span class="block text-[8px] font-bold opacity-30 uppercase">Secure Connection</span>
                </div>
                <button class="bg-white/10 border border-white/10 px-8 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-white hover:text-black transition">
                    View features
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        // --- ANIMATION ÉTOILES ---
        function createStar() {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random() * window.innerHeight + 'px';
            s.style.left = '-100px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 4000);
        }
        setInterval(createStar, 1500);

        // --- MUSIC ACTIVATION ---
        window.addEventListener('click', () => { 
            document.getElementById('bgMusic').play().catch(()=>{}); 
        }, { once: true });
    </script>
</body>
</html>
