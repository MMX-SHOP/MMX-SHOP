<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX | Private Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Orbitron:wght@900&display=swap');

        :root { 
            --accent: #a78bfa; 
            --accent-glow: rgba(167, 139, 250, 0.4);
            --bg: #020104; 
        }

        * { cursor: crosshair !important; box-sizing: border-box; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }

        /* --- FOND NEBULA MYSTÉRIEUX --- */
        #nebula { position: fixed; inset: 0; z-index: -1; filter: blur(1px); }

        /* --- NAVBAR FANTÔME --- */
        .nav {
            position: fixed; top: 0; width: 100%; height: 90px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 100;
        }
        .logo-container { display: flex; align-items: center; gap: 3px; }
        .logo-text { font-size: 26px; font-weight: 900; letter-spacing: -2px; }
        .logo-x { color: var(--accent); text-shadow: 0 0 20px var(--accent); }

        /* --- CENTRAL CORE (GLASSED) --- */
        .core-wrapper {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .glass-vault {
            width: 700px; padding: 60px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(50px);
            border: 1px solid rgba(167, 139, 250, 0.1);
            border-radius: 60px;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.5), inset 0 0 20px rgba(167, 139, 250, 0.05);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .title-glow {
            font-size: 85px; font-weight: 900; line-height: 0.8;
            text-transform: uppercase; letter-spacing: -4px;
            background: linear-gradient(to bottom, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(167, 139, 250, 0.3));
        }

        /* --- ICONES GLOWED & GLASSED --- */
        .icon-box {
            width: 50px; height: 50px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid var(--accent);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            color: var(--accent);
        }

        /* --- PANEL 3D (MYSTERY PURPLE) --- */
        #panel-overlay {
            position: fixed; inset: 0; background: rgba(2, 1, 4, 0.98);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            perspective: 2000px;
        }
        .panel-3d {
            width: 950px; height: 650px;
            background: #08080a; border-radius: 40px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            display: flex; overflow: hidden;
            transform: rotateY(-12deg) rotateX(4deg);
            box-shadow: -40px 40px 80px rgba(0,0,0,0.8), 0 0 40px rgba(167, 139, 250, 0.1);
        }

        /* --- BUTTONS & INPUTS --- */
        .btn-main {
            background: white; color: black; padding: 18px 45px;
            border-radius: 18px; font-weight: 900; font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px;
            transition: 0.4s; margin-top: 30px;
        }
        .btn-main:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }

        .price-chip {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            padding: 15px 25px; border-radius: 20px; transition: 0.3s;
        }
        .price-chip:hover { border-color: var(--accent); background: rgba(167, 139, 250, 0.05); }

    </style>
</head>
<body>

    <canvas id="nebula"></canvas>

    <!-- NAV -->
    <nav class="nav">
        <div class="logo-container">
            <span class="logo-text">MM<span class="logo-x">X</span></span>
        </div>
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-ping"></div>
                <span class="text-[9px] font-black tracking-[3px] opacity-40 uppercase">Encrypted</span>
            </div>
            <div class="icon-box cursor-pointer" onclick="togglePanel()">
                <i data-lucide="command" class="w-5 h-5"></i>
            </div>
        </div>
    </nav>

    <!-- CORE REVEAL -->
    <div class="core-wrapper">
        <div class="glass-vault" id="main-ui">
            <div class="flex justify-center mb-8">
                <div class="icon-box"><i data-lucide="shield-check" class="w-6 h-6"></i></div>
            </div>
            <h1 class="title-glow">NEBULA<br>PROTOCOL</h1>
            <p class="mt-6 text-[10px] tracking-[6px] opacity-30 font-bold uppercase">Advanced External Visuals & Aimbot</p>
            
            <div id="reveal-area" class="hidden animate-in fade-in duration-1000 mt-12">
                <div class="flex justify-center gap-4 mb-8">
                    <div class="price-chip">
                        <p class="text-[8px] opacity-30 font-black mb-1">24 HOURS</p>
                        <p class="text-xl font-black italic">4.99€</p>
                    </div>
                    <div class="price-chip border-purple-500/50 bg-purple-500/5">
                        <p class="text-[8px] text-purple-400 font-black mb-1">30 DAYS</p>
                        <p class="text-xl font-black italic">24.99€</p>
                    </div>
                    <div class="price-chip">
                        <p class="text-[8px] opacity-30 font-black mb-1">LIFETIME</p>
                        <p class="text-xl font-black italic">69.99€</p>
                    </div>
                </div>
                <button class="btn-main">Initialize Purchase</button>
            </div>

            <button id="btn-reveal" class="btn-main" onclick="revealContent()">Unlock Access</button>
        </div>
    </div>

    <!-- PANEL (INSERT) -->
    <div id="panel-overlay">
        <div class="panel-3d">
            <!-- Sidebar -->
            <div class="w-72 bg-black/50 border-r border-white/5 p-12 flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-black italic tracking-tighter mb-12">NEBULA<span class="text-[#a78bfa]">V2</span></h2>
                    <div class="space-y-6">
                        <div class="flex items-center gap-4 text-[#a78bfa] font-black text-[10px] tracking-widest"><i data-lucide="target" class="w-4 h-4"></i> COMBAT</div>
                        <div class="flex items-center gap-4 opacity-20 font-black text-[10px] tracking-widest"><i data-lucide="eye" class="w-4 h-4"></i> VISUALS</div>
                        <div class="flex items-center gap-4 opacity-20 font-black text-[10px] tracking-widest"><i data-lucide="zap" class="w-4 h-4"></i> EXPLOITS</div>
                    </div>
                </div>
                <div class="text-[8px] opacity-20 font-bold uppercase tracking-widest">Build: 04.2026.FN</div>
            </div>
            <!-- Main Settings -->
            <div class="flex-1 p-20">
                <div class="grid grid-cols-1 gap-8">
                    <div class="flex justify-between items-center p-6 bg-white/5 rounded-2xl border border-white/5">
                        <div>
                            <p class="text-xs font-black uppercase">Silent Aim</p>
                            <p class="text-[9px] opacity-30 uppercase">Perfect Accuracy Protocol</p>
                        </div>
                        <div class="w-12 h-6 bg-purple-600 rounded-full flex items-center justify-end px-1 shadow-[0_0_15px_rgba(167,139,250,0.5)]"><div class="w-4 h-4 bg-white rounded-full"></div></div>
                    </div>
                    <div class="flex justify-between items-center p-6 bg-white/5 rounded-2xl border border-white/5 opacity-40">
                        <div>
                            <p class="text-xs font-black uppercase">Visual Check</p>
                            <p class="text-[9px] opacity-30 uppercase">Raytrace Filtering</p>
                        </div>
                        <div class="w-12 h-6 bg-white/10 rounded-full flex items-center justify-start px-1"><div class="w-4 h-4 bg-white/20 rounded-full"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Nebula Animation (Lente et profonde)
        const canvas = document.getElementById('nebula');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<180; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    speed: Math.random() * 0.05 + 0.02,
                    opacity: Math.random()
                });
            }
        }

        function draw() {
            ctx.fillStyle = '#020104'; ctx.fillRect(0,0,canvas.width,canvas.height);
            stars.forEach(s => {
                s.y -= s.speed;
                if(s.y < 0) s.y = canvas.height;
                ctx.fillStyle = `rgba(167, 139, 250, ${s.opacity})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        init(); draw();

        // Reveal Logic
        function revealContent() {
            document.getElementById('btn-reveal').style.display = 'none';
            document.getElementById('reveal-area').classList.remove('hidden');
            document.getElementById('main-ui').style.width = "850px";
        }

        // Panel Toggle
        function togglePanel() {
            const p = document.getElementById('panel-overlay');
            p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
        }
        window.addEventListener('keydown', (e) => { if(e.key === 'Insert') togglePanel(); });
    </script>
</body>
</html>
