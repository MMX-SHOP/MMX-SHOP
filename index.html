<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX | Private Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --accent: #a78bfa; --bg: #030308; }
        * { cursor: none !important; box-sizing: border-box; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* CURSOR */
        #cursor {
            width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 200000;
            box-shadow: 0 0 15px var(--accent);
        }
        #cursor-follower {
            width: 30px; height: 30px; border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 199999;
            transition: transform 0.1s ease-out;
        }

        /* DYNAMIC BACKGROUND */
        #bg-canvas { position: fixed; inset: 0; z-index: -1; }
        .radial-overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(167, 139, 250, 0.03) 0%, transparent 80%);
            z-index: -1;
        }

        /* GLASS 3D CARDS */
        .glass-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            transform-style: preserve-3d;
            will-change: transform;
            transition: border 0.4s ease;
        }
        .glass-card:hover { border-color: var(--accent); }

        /* PRICE LIST ANIMATION CONTAINER */
        #price-list {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 25px;
            width: 100%;
        }

        /* UTILS */
        .reveal { opacity: 0; transform: translateY(30px); filter: blur(20px); }
        .logo-x { color: var(--accent); text-shadow: 0 0 20px var(--accent); font-style: italic; }
        
        .btn-purchase:active { animation: shake 0.2s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        nav { border-bottom: 1px solid rgba(255,255,255,0.03); }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-follower"></div>
    <div class="radial-overlay"></div>
    <canvas id="bg-canvas"></canvas>

    <div id="app">
        <nav class="fixed top-0 w-full h-[90px] px-[8%] flex justify-between items-center z-[5000] backdrop-blur-xl">
            <div class="text-2xl font-black italic tracking-tighter">MM<span class="logo-x">X</span></div>
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-2 opacity-40">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                    <span class="text-[8px] font-black uppercase tracking-[2px]">Bypass Live</span>
                </div>
                <div class="text-[9px] font-black opacity-20 tracking-[4px]">V2.0.4</div>
            </div>
        </nav>

        <main class="h-screen flex items-center px-[8%]">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center w-full">
                
                <div class="reveal" id="hero-text">
                    <h1 class="text-[6.5vw] font-black italic leading-[0.9] mb-8 tracking-tighter uppercase">
                        PREMIUM<br><span class="logo-x">PROTOCOL</span>
                    </h1>
                    
                    <div class="flex flex-col gap-6 max-w-xl">
                        <div class="flex gap-4">
                            <button class="btn-purchase bg-white text-black px-12 py-5 font-black uppercase text-[10px] tracking-widest hover:bg-purple-500 hover:text-white transition-all duration-500 shadow-2xl">
                                Purchase
                            </button>
                            <button onclick="togglePrices()" class="glass-card px-8 py-5 text-[10px] font-black uppercase tracking-widest flex items-center gap-3">
                                <i data-lucide="layers" class="w-4 h-4"></i> Show Prices
                            </button>
                        </div>

                        <div id="price-list">
                            <div class="glass-card p-4 text-center price-item">
                                <div class="text-[8px] opacity-40 mb-1">1D</div>
                                <div class="font-black text-sm italic">5€</div>
                            </div>
                            <div class="glass-card p-4 text-center price-item">
                                <div class="text-[8px] opacity-40 mb-1">7D</div>
                                <div class="font-black text-sm italic">15€</div>
                            </div>
                            <div class="glass-card p-4 text-center price-item border-purple-500/40 bg-purple-500/5">
                                <div class="text-[8px] text-purple-400 mb-1">30D</div>
                                <div class="font-black text-sm italic">35€</div>
                            </div>
                            <div class="glass-card p-4 text-center price-item border-yellow-500/20">
                                <div class="text-[8px] text-yellow-500 mb-1">LT</div>
                                <div class="font-black text-sm italic text-yellow-500">99€</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="reveal h-full flex items-center justify-center">
                    <div class="glass-card p-2 w-full max-w-lg rotate-3 hover:rotate-0 transition-transform duration-1000">
                        <img src="fortnite.jpg" class="w-full h-[450px] object-cover rounded-[22px] opacity-50 hover:opacity-80 transition-opacity" alt="Preview">
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        gsap.registerPlugin(ScrollTrigger);

        // CURSOR LOGIC
        const cur = document.getElementById('cursor');
        const fol = document.getElementById('cursor-follower');
        window.addEventListener('mousemove', e => {
            gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0 });
            gsap.to(fol, { x: e.clientX - 15, y: e.clientY - 15, duration: 0.1 });
        });

        // AUTO START ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.overflow = 'hidden';
            gsap.to(".reveal", {
                opacity: 1, y: 0, filter: "blur(0px)",
                duration: 1.5, stagger: 0.2, ease: "power4.out"
            });
            applyTilt();
        });

        // TILT 3D
        function applyTilt() {
            document.querySelectorAll('.glass-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    gsap.to(card, {
                        rotationY: x * 15, rotationX: -y * 15,
                        transformPerspective: 1000, duration: 0.4
                    });
                });
                card.addEventListener('mouseleave', () => {
                    gsap.to(card, { rotationY: 0, rotationX: 0, duration: 0.8 });
                });
            });
        }

        // PRICE LIST ANIMATION (GSAP)
        let pricesOpen = false;
        function togglePrices() {
            const list = document.getElementById('price-list');
            const items = document.querySelectorAll('.price-item');
            
            if(!pricesOpen) {
                list.style.display = 'grid';
                gsap.fromTo(items, 
                    { opacity: 0, y: 20, filter: "blur(10px)", scale: 0.8 },
                    { opacity: 1, y: 0, filter: "blur(0px)", scale: 1, duration: 0.6, stagger: 0.1, ease: "back.out(1.7)" }
                );
                pricesOpen = true;
            } else {
                gsap.to(items, { 
                    opacity: 0, y: 10, filter: "blur(10px)", duration: 0.4, stagger: 0.05, 
                    onComplete: () => { list.style.display = 'none'; }
                });
                pricesOpen = false;
            }
        }

        // BACKGROUND ANIMATION
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Point {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
        }
        function initBg() {
            for(let i=0; i<50; i++) points.push(new Point());
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(167, 139, 250, 0.05)";
            ctx.lineWidth = 0.5;
            for(let i=0; i<points.length; i++) {
                points[i].update();
                for(let j=i+1; j<points.length; j++) {
                    let d = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
                    if(d < 250) {
                        ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(points[j].x, points[j].y); ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        resize(); initBg(); draw(); window.onresize = resize;
    </script>
</body>
</html>
