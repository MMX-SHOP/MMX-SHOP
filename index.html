<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX PRIVATE | Elite FN External</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@700&display=swap');

        :root { --accent: #a78bfa; --bg: #030207; }
        * { cursor: crosshair !important; box-sizing: border-box; }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }

        /* --- FOND & ANIMATIONS --- */
        #nebula { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #0f081d 0%, #030207 100%); }
        
        .viewport {
            perspective: 2000px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 80px;
        }

        /* --- GLASS NAV (TON ANCIENNE NAV) --- */
        .glass-nav {
            position: fixed; top: 20px; width: 90%; max-width: 1200px;
            height: 60px; background: rgba(255,255,255,0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 1000;
        }

        /* --- PANEL 3D INCLINÉ (FIXÉ) --- */
        .mmx-panel {
            width: 1000px; height: 580px;
            background: rgba(10, 10, 15, 0.95);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            transform: rotateY(-12deg) rotateX(5deg);
            box-shadow: -40px 40px 80px rgba(0,0,0,0.8), 0 0 50px rgba(167, 139, 250, 0.05);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }
        .mmx-panel:hover { transform: rotateY(-3deg) rotateX(2deg) scale(1.01); }

        /* --- BARRE DE STATS (BAS DE PAGE MMX) --- */
        .stats-bar {
            position: fixed; bottom: 30px; width: 90%; max-width: 1100px;
            background: rgba(167, 139, 250, 0.03); backdrop-filter: blur(25px);
            border: 1px solid rgba(167, 139, 250, 0.15); border-radius: 25px;
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            animation: slideUp 1s ease-out;
        }

        .stat-val { font-family: 'Orbitron'; font-size: 18px; color: white; display: block; }
        .stat-lbl { font-size: 8px; font-weight: 900; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; }

        /* --- TABS --- */
        .tab-btn {
            padding: 14px 20px; border-radius: 12px; font-size: 10px; font-weight: 900;
            text-transform: uppercase; color: #444; display: flex; align-items: center; gap: 12px;
            transition: 0.3s; width: 100%;
        }
        .tab-btn.active { background: rgba(167, 139, 250, 0.1); color: var(--accent); }

        /* --- UI ELEMENTS --- */
        .switch { appearance: none; width: 34px; height: 18px; background: #1a1a20; border-radius: 20px; position: relative; cursor: pointer; }
        .switch:checked { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .switch::before { content: ''; position: absolute; width: 12px; height: 12px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .switch:checked::before { transform: translateX(16px); }

        @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- ÉTOILES --- */
        .star { position: absolute; background: linear-gradient(90deg, var(--accent), transparent); height: 1px; pointer-events: none; animation: fly 4s linear infinite; }
        @keyframes fly { 0% { transform: translateX(-200px) rotate(45deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateX(1200px) translateY(1200px) rotate(45deg); opacity: 0; } }
    </style>
</head>
<body>

    <div id="nebula"></div>
    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <!-- NAVIGATION (TON ANCIENNE BARRE) -->
    <div class="flex justify-center">
        <nav class="glass-nav">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-[#a78bfa] rounded-full animate-pulse shadow-[0_0_10px_#a78bfa]"></div>
                <span class="text-[10px] font-black tracking-[4px] uppercase">MMX STATUS: <span class="text-green-500">UNDETECTED</span></span>
            </div>
            <div class="flex gap-8 text-[9px] font-bold uppercase tracking-widest opacity-40">
                <a href="#" class="hover:text-[#a78bfa] hover:opacity-100 transition">Dashboard</a>
                <a href="#" class="hover:text-[#a78bfa] hover:opacity-100 transition">Store</a>
            </div>
            <button class="bg-[#a78bfa] text-black px-5 py-2 rounded-lg font-black text-[9px] uppercase tracking-tighter hover:scale-105 transition" onclick="window.open('https://discord.gg/votrelien')">Discord Access</button>
        </nav>
    </div>

    <div class="viewport">
        
        <!-- LE PANEL 3D INTEGRÉ -->
        <div class="mmx-panel">
            <!-- Sidebar -->
            <div class="w-64 bg-black/40 border-r border-white/5 p-8 flex flex-col">
                <div class="mb-10">
                    <h1 class="text-2xl font-black italic tracking-tighter">MMX<span class="text-[#a78bfa]">PRIVATE</span></h1>
                    <p class="text-[8px] font-bold opacity-20 uppercase tracking-[3px]">External v2.4</p>
                </div>
                
                <div class="space-y-1">
                    <button class="tab-btn active" onclick="show('aim')"><i data-lucide="crosshair" class="w-4 h-4"></i> Combat</button>
                    <button class="tab-btn" onclick="show('vis')"><i data-lucide="eye" class="w-4 h-4"></i> Visuals</button>
                    <button class="tab-btn" onclick="show('exp')"><i data-lucide="zap" class="w-4 h-4"></i> Exploits</button>
                </div>

                <div class="mt-auto p-4 bg-white/5 border border-white/5 rounded-2xl">
                    <span class="text-[8px] font-black opacity-40 uppercase">User: Elite Member</span>
                    <div class="w-full h-1 bg-white/10 rounded-full mt-2 overflow-hidden">
                        <div class="w-3/4 h-full bg-[#a78bfa]"></div>
                    </div>
                </div>
            </div>

            <!-- Content (Fixed Features) -->
            <div class="flex-1 p-12 bg-gradient-to-br from-transparent to-[#0a0616]">
                <div id="aim" class="tab-content">
                    <h3 class="text-2xl font-black italic uppercase mb-8">Aimbot <span class="text-[#a78bfa]">Config</span></h3>
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div class="flex justify-between items-center p-4 bg-white/5 border border-white/5 rounded-xl">
                                <span class="text-[10px] font-black uppercase">Enable Aim</span>
                                <input type="checkbox" class="switch" checked>
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-[9px] font-black uppercase opacity-40"><span>Smoothing</span><span>8.5</span></div>
                                <input type="range" class="w-full accent-[#a78bfa]">
                            </div>
                        </div>
                        <div class="space-y-4">
                            <select class="w-full bg-white/5 p-4 rounded-xl text-[10px] font-black uppercase border border-white/10">
                                <option>Bone: Head</option>
                                <option>Bone: Chest</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Autres sections cachées par défaut -->
                <div id="vis" class="tab-content hidden">
                    <h3 class="text-2xl font-black italic uppercase mb-8">Visual <span class="text-[#a78bfa]">Engine</span></h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl text-[10px] font-black uppercase"><span>Box ESP</span> <input type="checkbox" class="switch" checked></div>
                        <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl text-[10px] font-black uppercase"><span>Skeleton</span> <input type="checkbox" class="switch" checked></div>
                    </div>
                </div>
                
                <div id="exp" class="tab-content hidden">
                    <h3 class="text-2xl font-black italic uppercase mb-8 text-red-500">Dangerous <span class="text-white">Exploits</span></h3>
                    <div class="p-4 bg-red-500/5 border border-red-500/20 rounded-xl text-[10px] font-black uppercase flex justify-between items-center">
                        <span>No Recoil / Spread</span> <input type="checkbox" class="switch">
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER STATS (LE BAS DU SITE) -->
        <div class="stats-bar">
            <div class="flex gap-16">
                <div class="stat-item"><span class="stat-val">128</span><span class="stat-lbl">Clés Totales</span></div>
                <div class="stat-item"><span class="stat-val">84</span><span class="stat-lbl">HWID Liés</span></div>
                <div class="stat-item"><span class="stat-val">12ms</span><span class="stat-lbl">Latence API</span></div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <span class="text-[10px] font-black text-green-400 uppercase">System Secure</span>
                    <p class="text-[8px] opacity-30 font-bold uppercase">Kernel Bypass v4.2</p>
                </div>
                <button class="bg-[#a78bfa] text-black px-8 py-3 rounded-xl font-black uppercase text-[10px] hover:scale-105 transition shadow-[0_0_20px_rgba(167,139,250,0.3)]">Ouvrir Panel</button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }

        function createStar() {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random() * window.innerHeight + 'px';
            s.style.left = '-100px';
            s.style.width = Math.random() * 100 + 50 + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 4000);
        }
        setInterval(createStar, 1500);

        window.addEventListener('click', () => { 
            document.getElementById('bgMusic').play().catch(()=>{}); 
        }, { once: true });
    </script>
</body>
</html>
