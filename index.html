<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMX | Private</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=Orbitron:wght@700&family=JetBrains+Mono&display=swap');

        :root { 
            --accent: #a78bfa; 
            --accent-glow: rgba(167, 139, 250, 0.4);
            --bg: #000000; 
        }

        * { cursor: crosshair !important; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; }

        /* --- BACKGROUND MODERNE --- */
        #particles-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .grid-overlay { 
            position: fixed; inset: 0; 
            background-image: linear-gradient(to right, rgba(167, 139, 250, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(167, 139, 250, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1;
        }

        /* --- NAV (Logo sans fond & Gros) --- */
        #main-nav {
            position: fixed; top: 0; width: 100%; height: 100px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 8%; z-index: 1000; background: linear-gradient(to bottom, black, transparent);
        }
        .logo-container {
            height: 70px; width: 150px;
            display: flex; align-items: center;
        }
        .nav-logo { 
            height: 100%; width: auto; 
            mix-blend-mode: lighten; /* Enlève le fond noir du jpg */
            filter: contrast(1.2) brightness(1.2);
            transform: scale(1.8); /* Rend le logo + gros */
        }

        /* --- MAIN CARD --- */
        .hero-section { position: relative; z-index: 10; padding-top: 160px; display: flex; justify-content: center; }
        .product-card {
            background: rgba(10, 10, 10, 0.8); 
            border: 1px solid rgba(167, 139, 250, 0.2);
            display: flex; width: 1000px; border-radius: 4px; 
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(167, 139, 250, 0.1);
        }
        .card-left { width: 50%; background: #000; border-right: 1px solid rgba(167, 139, 250, 0.1); overflow: hidden; }
        .card-left img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

        .price-item {
            border: 1px solid rgba(255,255,255,0.05); padding: 15px; text-align: center;
            font-size: 11px; font-weight: 800; text-transform: uppercase; transition: 0.4s;
            background: rgba(255,255,255,0.02);
        }
        .price-item.active { border-color: var(--accent); color: var(--accent); background: rgba(167, 139, 250, 0.1); box-shadow: inset 0 0 15px rgba(167, 139, 250, 0.1); }

        /* --- MODAL PANEL "THE END" STYLE --- */
        #feature-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 2000; display: none; padding: 40px; overflow-y: auto;
            backdrop-filter: blur(15px);
        }
        .panel-header-title { font-family: 'Orbitron', sans-serif; letter-spacing: 4px; color: white; }
        
        .panel-card {
            background: #050505; border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 8px; padding: 25px; transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-card:hover { border-color: var(--accent); box-shadow: 0 0 20px rgba(167, 139, 250, 0.1); }

        /* UI Elements */
        .ui-switch {
            width: 40px; height: 20px; background: #1a1a1a; border-radius: 20px; 
            position: relative; cursor: pointer; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .ui-switch.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .ui-switch::after { content: ''; position: absolute; width: 14px; height: 14px; background: white; border-radius: 50%; top: 2px; left: 3px; transition: 0.3s; }
        .ui-switch.on::after { left: 21px; }

        .btn-purchase { 
            background: white; color: black; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 2px; transition: 0.3s;
        }
        .btn-purchase:hover { background: var(--accent); color: white; box-shadow: 0 0 30px var(--accent-glow); }

        .violet-txt { color: var(--accent); }
    </style>
</head>
<body>

    <!-- Audio auto-load -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="grid-overlay"></div>
    <canvas id="particles-canvas"></canvas>

    <nav id="main-nav">
        <div class="logo-container">
            <img src="logo.jpg" class="nav-logo" alt="MMX">
        </div>
        <div class="flex gap-12 text-[11px] font-bold uppercase tracking-[4px]">
            <a href="#" class="hover:violet-txt transition">Store</a>
            <a href="https://discord.com/users/kyotouhq" target="_blank" class="hover:violet-txt transition">Support</a>
            <a href="#" class="hover:violet-txt transition">Status</a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="product-card">
            <div class="card-left">
                <!-- Correction de l'extension .jpg -->
                <img src="fortnite.jpg" alt="MMX Fortnite" onerror="this.src='https://i.imgur.com/8pS7yqV.png'">
            </div>
            <div class="flex-1 p-12 flex flex-col justify-center">
                <span class="violet-txt font-black text-[11px] tracking-[6px] uppercase">Elite Private Build</span>
                <h1 class="text-6xl font-black mt-2 mb-8 tracking-tighter italic">Fortnite <span class="violet-txt">Private</span></h1>
                
                <div class="flex gap-8 mb-10">
                    <div class="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest">
                        <span class="w-2 h-2 bg-white rounded-full shadow-[0_0_10px_white]"></span> Undetected
                    </div>
                    <div class="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest">
                        <span class="w-2 h-2 bg-[#a78bfa] rounded-full shadow-[0_0_10px_#a78bfa]"></span> Kernel
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-3 mb-10">
                    <div class="price-item" onclick="setPrice('4.99€', this)">Day</div>
                    <div class="price-item" onclick="setPrice('14.99€', this)">Week</div>
                    <div class="price-item active" onclick="setPrice('24.99€', this)">Month</div>
                    <div class="price-item" onclick="setPrice('69.99€', this)">Lifetime</div>
                </div>

                <div class="flex items-center justify-between">
                    <div id="big-price" class="text-4xl font-bold font-['Orbitron'] tracking-tighter">24.99€</div>
                    <button class="btn-purchase px-14 py-5 text-[12px]" onclick="alert('Checkout not linked')">Purchase Now</button>
                </div>

                <button class="mt-10 text-[10px] text-gray-500 uppercase tracking-[5px] hover:violet-txt transition-all" onclick="toggleOverlay(true)">
                    [ Click to see Features ]
                </button>
            </div>
        </div>
    </section>

    <!-- MODERN FEATURE PANEL -->
    <div id="feature-overlay">
        <div class="max-w-6xl mx-auto py-10">
            <div class="flex justify-between items-end mb-16 border-b border-white/10 pb-8">
                <div>
                    <h2 class="panel-header-title text-4xl uppercase font-black">MMX <span class="violet-txt">Control</span></h2>
                    <p class="text-gray-500 text-[11px] uppercase tracking-[4px] mt-2">v4.0.2 Internal Configuration</p>
                </div>
                <button class="text-6xl font-light hover:violet-txt transition" onclick="toggleOverlay(false)">&times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Aimbot -->
                <div class="panel-card">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-1 h-6 bg-purple-500"></div>
                        <h3 class="font-bold uppercase tracking-widest text-sm">Combat Systems</h3>
                    </div>
                    <div class="space-y-6">
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>Aimbot Master</span> <div class="ui-switch on"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold text-gray-400">
                            <span>Prediction</span> <div class="ui-switch"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>Fov Color</span> <input type="color" value="#a78bfa" class="bg-transparent border-none w-8">
                        </div>
                    </div>
                </div>

                <!-- Visuals -->
                <div class="panel-card">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-1 h-6 bg-white"></div>
                        <h3 class="font-bold uppercase tracking-widest text-sm">Visual Overlay</h3>
                    </div>
                    <div class="space-y-6">
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>Box ESP</span> <div class="ui-switch on"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>Skeleton</span> <div class="ui-switch on"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold text-gray-400">
                            <span>Snaplines</span> <div class="ui-switch"></div>
                        </div>
                    </div>
                </div>

                <!-- Misc -->
                <div class="panel-card">
                    <div class="flex items-center gap-3 mb-8">
                        <div class="w-1 h-6 bg-purple-500"></div>
                        <h3 class="font-bold uppercase tracking-widest text-sm">Exploits / Misc</h3>
                    </div>
                    <div class="space-y-6">
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>No Recoil</span> <div class="ui-switch on"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold text-gray-400">
                            <span>Magic Bullet</span> <div class="ui-switch"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs uppercase font-semibold">
                            <span>Watermark</span> <div class="ui-switch on"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Particles ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, flakes = [];
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        function init() {
            flakes = [];
            for (let i = 0; i < 60; i++) flakes.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5, s: Math.random()*0.3+0.1, o: Math.random()*0.6 });
        }
        function draw() {
            ctx.clearRect(0,0,W,H);
            flakes.forEach(f => {
                ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(167, 139, 250, ${f.o})`; ctx.fill();
                f.y += f.s; if (f.y > H) f.y = -5;
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize); resize(); init(); draw();

        // --- Interaction ---
        function setPrice(p, el) {
            document.getElementById('big-price').innerText = p;
            document.querySelectorAll('.price-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleOverlay(show) {
            document.getElementById('feature-overlay').style.display = show ? 'block' : 'none';
            document.body.style.overflow = show ? 'hidden' : 'auto';
        }

        document.querySelectorAll('.ui-switch').forEach(s => {
            s.onclick = () => s.classList.toggle('on');
        });

        // Musique au premier clic
        window.onclick = () => {
            const audio = document.getElementById('bgMusic');
            if(audio.paused) audio.play();
        }
    </script>
</body>
</html>
